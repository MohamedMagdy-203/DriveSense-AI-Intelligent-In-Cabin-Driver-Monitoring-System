camera:
  index: 0
  width: 640
  height: 480
  window_name: "MediaPipe Face Landmarker"

mediapipe:
  model_path: "models/face_landmarker.task"
  delegate: "CPU"
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5

temporal:
  head_pose_window_seconds: 2.0
  long_glance_seconds: 3.0
  glance_window_seconds: 30.0
  reengagement_seconds: 2.0
  cumulative_glance_seconds: 10.0

drowsiness:
  perclos_window_seconds: 60.0
  closure_score_threshold: 0.8
  blink_exclusion_seconds: 0.2
  prolonged_closure_test_seconds: 4.0
  open_openness_baseline: 0.3298
  closed_openness_baseline: 0.0736
